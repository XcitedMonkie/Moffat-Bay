<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Message Preview | Moffat Bay Lodge</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
</head>

<body>

    <main class="about-main">

        <section class="contact-simple">
            <div class="content-container">

                <span class="section-eyebrow">
                    Contact Us
                </span>

                <h1>Email Preview</h1>

                <div class="section-divider"></div>

                <p>
                    This is a test preview of the email.
                    No email has actually been sent.
                </p>

                <div class="email-preview">

                    <p>
                        <strong>To:</strong>
                        <span id="previewTo"></span>
                    </p>

                    <p>
                        <strong>Subject:</strong>
                        New Contact Message - Moffat Bay Lodge
                    </p>

                    <hr>

                    <p>
                        <strong>Name:</strong>
                        <span id="previewName"></span>
                    </p>

                    <p>
                        <strong>Date/Time</strong>
                        <span id="currentDateTime"></span>
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <span id="previewEmail"></span>
                    </p>

                    <p><strong>Message:</strong></p>

                    <p id="previewMessage"></p>

                </div>

                <a href="about.html"
                   class="btn btn-primary">
                    Back to Contact Us
                </a>

            </div>
        </section>

    </main>

    <script src="js/contact-preview.js"></script>
 
</body>
</html>
